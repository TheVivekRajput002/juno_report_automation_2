<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Report Automation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Navigation / Header -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-icon">📊</div>
        <div>
          <h1 class="logo-title">Juno Report Automation</h1>
          <p class="logo-subtitle">Zomato & Swiggy Performance Sync</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="setupLoginBtn" class="btn-secondary-sm" title="Launch browser to sign in to Zomato with Google">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Zomato Login
        </button>
        <button id="setupSwiggyLoginBtn" class="btn-secondary-sm" title="Launch browser to sign in to Swiggy Partner portal">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Swiggy Login
        </button>
        <a id="sheetLinkHeader" href="https://docs.google.com/spreadsheets/d/1KLnQnbQhOwb11W-kmT_UxHJPaCjQuUQinp-lYZs_zRE/edit#gid=139067608" target="_blank" class="btn-sheet-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Google Sheet
        </a>
      </div>
    </header>

    <!-- Main Automation Control Card -->
    <main class="main-card" id="mainCard">
      <!-- Card Top Badge Header -->
      <div class="card-top-row">
        <div class="outlet-badge-group">
          <span class="badge-pill">OUTLET</span>
          <span class="outlet-title" id="currentOutletNameDisplay">The Paneer Story</span>
        </div>
        <div class="status-indicator-pill" id="statusPill">
          <span class="status-dot"></span>
          <span id="statusText">Ready</span>
        </div>
      </div>

      <!-- Section: Outlet Configuration Cards -->
      <div class="form-group cards-section">
        <div class="section-header-row">
          <div class="section-title-group">
            <label class="section-label">OUTLET EXTRACTION CARDS</label>
            <span class="badge-count" id="cardCountBadge">1 Card</span>
          </div>
          <div class="header-action-group">
            <button type="button" id="addAllSavedBtn" class="btn-action-ghost" title="Add all saved outlets as individual cards">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
              Add All Saved Outlets
            </button>
            <button type="button" id="addCardBtnTop" class="btn-action-ghost accent" title="Add another outlet card">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add Card
            </button>
          </div>
        </div>

        <!-- Dynamic Self-Contained Outlet Cards Container -->
        <div id="cardsContainer" class="cards-container">
          <!-- Populated dynamically via app.js -->
        </div>

        <!-- Add Another Card Button (Bottom) -->
        <button type="button" id="addCardBtnBottom" class="btn-add-card">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Add Another Outlet Card</span>
        </button>
      </div>

      <!-- Primary Action Button -->
      <div class="action-btn-area">
        <button type="button" id="generateBtn" class="btn-primary-generate">
          <span class="btn-icon">▷</span>
          <span class="btn-text">Run All Configurations</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </div>

      <!-- Real-Time Progress & Terminal Logs -->
      <div id="executionPanel" class="execution-panel hidden">
        <div class="panel-header">
          <div class="panel-title">
            <span class="terminal-dot red"></span>
            <span class="terminal-dot yellow"></span>
            <span class="terminal-dot green"></span>
            <span>Live Automation Logs</span>
          </div>
          <div class="panel-actions">
            <a id="liveSheetLink" href="#" target="_blank" class="live-sheet-btn hidden">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              Open Google Sheet ↗
            </a>
            <button id="clearLogsBtn" class="btn-clear-sm" title="Clear logs">Clear</button>
          </div>
        </div>
        <div class="terminal-body" id="terminalLogs">
          <div class="log-line text-muted">Ready to run automation. Click "Generate & Sync Report" above.</div>
        </div>
      </div>
    </main>

    <!-- Footer Info -->
    <footer class="app-footer">
      <span>Auto-syncing to Google Sheets tab: <code>Automated Reports</code></span>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
