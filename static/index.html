<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Report Automation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Navigation / Header -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-icon">📊</div>
        <div>
          <h1 class="logo-title">Juno Report Automation</h1>
          <p class="logo-subtitle">Zomato & Swiggy Performance Sync</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="setupLoginBtn" class="btn-secondary-sm" title="Launch browser to sign in to Google once">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Google Login Setup
        </button>
        <a id="sheetLinkHeader" href="https://docs.google.com/spreadsheets/d/1KLnQnbQhOwb11W-kmT_UxHJPaCjQuUQinp-lYZs_zRE/edit#gid=139067608" target="_blank" class="btn-sheet-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Google Sheet
        </a>
      </div>
    </header>

    <!-- Main Automation Control Card -->
    <main class="main-card" id="mainCard">
      <!-- Card Top Badge Header -->
      <div class="card-top-row">
        <div class="outlet-badge-group">
          <span class="badge-pill">OUTLET</span>
          <span class="outlet-title" id="currentOutletNameDisplay">The Paneer Story</span>
        </div>
        <div class="status-indicator-pill" id="statusPill">
          <span class="status-dot"></span>
          <span id="statusText">Ready</span>
        </div>
      </div>

      <!-- Section: Select Outlet -->
      <div class="form-group">
        <label class="section-label">SELECT OUTLET</label>
        <div class="outlet-selector-row">
          <div class="custom-select-wrapper">
            <select id="outletSelect" class="form-select">
              <!-- Populated via app.js -->
            </select>
            <div class="select-arrow">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
          </div>
          <button type="button" id="customToggleBtn" class="btn-outline-custom">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            Custom
          </button>
        </div>

        <!-- Custom Outlet Input Box (Collapsible) -->
        <div id="customOutletDrawer" class="custom-outlet-drawer hidden">
          <div class="custom-inputs-grid">
            <div class="input-field">
              <label>Outlet Name</label>
              <input type="text" id="customOutletName" placeholder="e.g. Spice Route" />
            </div>
            <div class="input-field">
              <label>Zomato ID</label>
              <input type="text" id="customZomatoId" placeholder="e.g. 22663260" />
            </div>
            <div class="input-field">
              <label>Swiggy ID (Optional)</label>
              <input type="text" id="customSwiggyId" placeholder="e.g. 1363315" />
            </div>
          </div>
          <div class="custom-drawer-actions">
            <button type="button" id="saveCustomOutletBtn" class="btn-save-sm">Save & Use Outlet</button>
            <button type="button" id="cancelCustomBtn" class="btn-cancel-sm">Cancel</button>
          </div>
        </div>
      </div>

      <!-- Section: Date Range & Platform -->
      <div class="controls-grid">
        <!-- Date Range -->
        <div class="form-group">
          <label class="section-label">DATE RANGE</label>
          <div class="segmented-control" id="dateRangeSegmented">
            <button type="button" class="segment-btn active" data-range="1">1 Wk</button>
            <button type="button" class="segment-btn" data-range="2">2 Wks</button>
            <button type="button" class="segment-btn" data-range="3">3 Wks</button>
            <button type="button" class="segment-btn" data-range="custom">Custom</button>
          </div>

          <!-- Custom Date Pickers (Shown when 'Custom' is active) -->
          <div id="customDatePickerRow" class="custom-date-row hidden">
            <div class="date-input-wrap">
              <label>Start</label>
              <input type="date" id="customStartDate" />
            </div>
            <span class="date-sep">to</span>
            <div class="date-input-wrap">
              <label>End</label>
              <input type="date" id="customEndDate" />
            </div>
          </div>
        </div>

        <!-- Platform -->
        <div class="form-group">
          <label class="section-label">PLATFORM</label>
          <div class="segmented-control" id="platformSegmented">
            <button type="button" class="segment-btn active" data-platform="both">Both</button>
            <button type="button" class="segment-btn" data-platform="z">Z</button>
            <button type="button" class="segment-btn" data-platform="s" title="Swiggy (Placeholder)">S</button>
          </div>
        </div>
      </div>

      <!-- Primary Action Button -->
      <div class="action-btn-area">
        <button type="button" id="generateBtn" class="btn-primary-generate">
          <span class="btn-icon">▷</span>
          <span class="btn-text">Generate &amp; Sync Report</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </div>

      <!-- Real-Time Progress & Terminal Logs -->
      <div id="executionPanel" class="execution-panel hidden">
        <div class="panel-header">
          <div class="panel-title">
            <span class="terminal-dot red"></span>
            <span class="terminal-dot yellow"></span>
            <span class="terminal-dot green"></span>
            <span>Live Automation Logs</span>
          </div>
          <div class="panel-actions">
            <a id="liveSheetLink" href="#" target="_blank" class="live-sheet-btn hidden">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              Open Google Sheet ↗
            </a>
            <button id="clearLogsBtn" class="btn-clear-sm" title="Clear logs">Clear</button>
          </div>
        </div>
        <div class="terminal-body" id="terminalLogs">
          <div class="log-line text-muted">Ready to run automation. Click "Generate & Sync Report" above.</div>
        </div>
      </div>
    </main>

    <!-- Footer Info -->
    <footer class="app-footer">
      <span>Auto-syncing to Google Sheets tab: <code>Automated Reports</code></span>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
